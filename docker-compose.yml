services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes

  krishi-ai:
    build: .
    ports:
      - "8061:8061"
    volumes:
      - .:/app
      - chroma_data:/app/chroma_db
    environment:
      - PYTHONPATH=/app
      - REDIS_URL=redis://redis:6379
    env_file:
      - .env
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  redis_data:
  chroma_data:
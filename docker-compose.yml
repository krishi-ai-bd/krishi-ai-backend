services:
  krishi-ai:
    build: .
    ports:
      - "8061:8061"
    volumes:
      - .:/app
      - chroma_data:/app/chroma_db
    environment:
      - PYTHONPATH=/app
      # Connect to Redis running on host machine
      - REDIS_URL=redis://host.docker.internal:6379
    env_file:
      - .env
    restart: unless-stopped
    # Allow container to access host network
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  chroma_data: